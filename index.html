            registerPwaServiceWorker();
            loadAppSettings();
            drawOrientationClock();
            populatePathologyModal();
            updateFormUI();
            setPrintHeader();
            checkAutoSaveOnLoad();
            
            document.getElementById('procedureDate').value = new Date().toISOString().slice(0, 10);

            if (!activePassphrase) {
                openStartGatewayModal();
            }

            ['lesionLocation', 'lesionLength', 'lesionWidth', 'margin', 'punchSize', 'flapGraftJustification', 'anestheticVolume', 'skinPrepSolution', 'localAnesthetic', 'excisionDepth', 'hemostasisMethod', 'dressingApplied', 'skinSutureType', 'skinSutureSize', 'deepSutureType', 'deepSutureSize'].forEach(id => {

            });

        // --- PWA INSTALLATION & SERVICE WORKER ENGINE ---
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPwaPrompt = e;
            const installBtn = document.getElementById('installPwaBtn');
            if (installBtn) installBtn.classList.remove('hidden');
            showToast("📱 SurgiFile ready to install! Click 'Install App' in top header.");
        });

        async function triggerPwaInstall() {
            if (!deferredPwaPrompt) {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    alert("To install SurgiFile on iOS:\n1. Tap the Share button in Safari\n2. Scroll down and tap 'Add to Home Screen'");
                } else {
                    showToast("Installation prompt not active or app is already installed.");
                }
                return;
            }
            deferredPwaPrompt.prompt();
            const { outcome } = await deferredPwaPrompt.userChoice;
            if (outcome === 'accepted') {
                showToast("SurgiFile installed successfully!");
                const installBtn = document.getElementById('installPwaBtn');
                if (installBtn) installBtn.classList.add('hidden');
            }
            deferredPwaPrompt = null;
        }

        function registerPwaServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA ServiceWorker Active:', reg.scope))
                    .catch(err => console.warn('SW registration waiting for sw.js:', err));
            }
        }
